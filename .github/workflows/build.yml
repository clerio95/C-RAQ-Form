name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Instala mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 make

      - name: Testes (Linux)
        run: make test

      - name: Compila RAQ.exe
        run: make windows

      - uses: actions/upload-artifact@v4
        with:
          name: RAQ.exe
          path: dist/RAQ.exe
